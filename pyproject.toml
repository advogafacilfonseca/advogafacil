[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "advoga-facil"
version = "0.1.0"
description = "Advoga Fácil — sistema de gestão para escritório de advocacia"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
servidor = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.3",
    "argon2-cffi>=23.1",
    "email-validator>=2.1",
    "cryptography>=42",
    "reportlab>=4.2",
    "openpyxl>=3.1",
]
desktop = [
    "PySide6>=6.7",
]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pillow>=10",
    "pyinstaller>=6.6",
]

[project.scripts]
advoga-servidor = "advoga_server.__main__:main"

[project.gui-scripts]
advoga-facil = "advoga_desktop.main:main"

[tool.setuptools.packages.find]
where = ["shared", "server", "desktop"]

[tool.setuptools.package-data]
advoga_server = ["alembic.ini", "alembic/*.py", "alembic/versions/*.py", "recursos/*"]
advoga_desktop = ["recursos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
