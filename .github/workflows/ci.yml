name: Testes e instaladores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADVOGA_TESTE_PG_ADMIN: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Dependências
        run: pip install -e ".[servidor,desktop,dev]"
      - name: Testes automatizados
        run: python -m pytest -q --junitxml=relatorio-testes.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: relatorio-testes.xml

  instaladores-windows:
    needs: testes
    runs-on: windows-latest
    env:
      # Binários oficiais do PostgreSQL para Windows (EDB). Atualize a versão quando necessário.
      PG_ZIP_URL: https://get.enterprisedb.com/postgresql/postgresql-16.6-1-windows-x64-binaries.zip
      WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install ".[servidor,desktop]" pyinstaller
      - name: Gerar executáveis (PyInstaller)
        run: |
          pyinstaller --noconfirm installer/pyinstaller/advoga_facil.spec
          pyinstaller --noconfirm installer/pyinstaller/advoga_servidor.spec
      - name: Teste rápido do servidor empacotado
        run: dist\AdvogaFacilServidor\AdvogaFacilServidor.exe --help
      - name: Baixar PostgreSQL e WinSW
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PG_ZIP_URL -OutFile pg.zip
          Expand-Archive pg.zip -DestinationPath dist\pg_tmp
          Move-Item dist\pg_tmp\pgsql dist\pgsql
          Remove-Item -Recurse dist\pgsql\pgAdmin* , dist\pgsql\doc, dist\pgsql\symbols -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist\winsw | Out-Null
          Invoke-WebRequest $env:WINSW_URL -OutFile dist\winsw\WinSW-x64.exe
      - name: Gerar instaladores (Inno Setup)
        run: |
          iscc installer\inno\advoga_facil.iss
          iscc installer\inno\advoga_servidor.iss
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          path: dist/instaladores/*.exe
