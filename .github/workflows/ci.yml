name: Testes e instaladores

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-24.04  # fixo: o PostgreSQL 16 (pg_dump/pg_restore dos backups) vem do repositório desta versão
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADVOGA_TESTE_PG_ADMIN: postgresql+psycopg://postgres@127.0.0.1:5432/postgres
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas do Qt e programas do PostgreSQL (backups)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 postgresql-client-16
      - name: Dependências
        run: pip install -e ".[servidor,desktop,dev]"
      - name: Testes automatizados
        run: python -m pytest -q --junitxml=relatorio-testes.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: relatorio-testes.xml

  instaladores-windows:
    needs: testes
    runs-on: windows-latest
    env:
      # Binários oficiais do PostgreSQL para Windows (EDB). Atualize a versão quando necessário.
      PG_ZIP_URL: https://get.enterprisedb.com/postgresql/postgresql-16.6-1-windows-x64-binaries.zip
      WINSW_URL: https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependências
        run: pip install ".[servidor,desktop]" pyinstaller
      - name: Gerar executáveis (PyInstaller)
        run: |
          pyinstaller --noconfirm installer/pyinstaller/advoga_facil.spec
          pyinstaller --noconfirm installer/pyinstaller/advoga_servidor.spec
      - name: Teste rápido do servidor empacotado
        run: dist\AdvogaFacilServidor\AdvogaFacilServidor.exe --help
      - name: Baixar PostgreSQL e WinSW
        shell: pwsh
        run: |
          Invoke-WebRequest $env:PG_ZIP_URL -OutFile pg.zip
          Expand-Archive pg.zip -DestinationPath dist\pg_tmp
          Move-Item dist\pg_tmp\pgsql dist\pgsql
          Remove-Item -Recurse dist\pgsql\pgAdmin* , dist\pgsql\doc, dist\pgsql\symbols -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force dist\winsw | Out-Null
          Invoke-WebRequest $env:WINSW_URL -OutFile dist\winsw\WinSW-x64.exe
      - name: Gerar instaladores (Inno Setup)
        run: |
          iscc installer\inno\advoga_facil.iss
          iscc installer\inno\advoga_servidor.iss
      - name: Teste real do instalador do servidor (instalar, atualizar e desinstalar)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inst = Get-ChildItem dist\instaladores\AdvogaFacilServidor-Instalador-*.exe | Select-Object -First 1
          function Diagnostico {
            Write-Host "===== Serviços"
            Get-Service AdvogaFacil* -ErrorAction SilentlyContinue | Format-Table Name, Status, StartType | Out-Host
            Write-Host "===== Portas"
            Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 5433, 8765 } | Out-Host
            foreach ($arq in Get-ChildItem "$env:ProgramData\AdvogaFacil\logs" -File -ErrorAction SilentlyContinue) {
              Write-Host "===== $($arq.FullName)"
              Get-Content $arq.FullName -Tail 80 | Out-Host
            }
            foreach ($arq in Get-ChildItem "$env:ProgramData\AdvogaFacil\postgres\data\log" -File -ErrorAction SilentlyContinue) {
              Write-Host "===== $($arq.FullName)"
              Get-Content $arq.FullName -Tail 40 | Out-Host
            }
            foreach ($arq in Get-ChildItem inst*.log -ErrorAction SilentlyContinue) {
              Write-Host "===== $($arq.Name)"
              Get-Content $arq -Tail 40 | Out-Host
            }
          }
          function Esperar-Servidor {
            for ($i = 0; $i -lt 60; $i++) {
              try { return Invoke-RestMethod https://127.0.0.1:8765/api/saude -SkipCertificateCheck -TimeoutSec 5 }
              catch { Start-Sleep -Seconds 3 }
            }
            Diagnostico
            throw "O servidor instalado não respondeu."
          }
          # 1) Instalação nova
          Start-Process $inst.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=inst1.log" -Wait
          $s = Esperar-Servidor
          if ($s.banco -ne "ok" -or $s.configurado) { throw "Estado inesperado após instalar: $($s | ConvertTo-Json)" }
          if (-not (Test-Path "$env:ProgramData\AdvogaFacil\config\CODIGO_DE_INSTALACAO.txt")) { throw "Sem código de instalação" }
          if (-not (Test-Path "$env:ProgramData\AdvogaFacil\config\COMO_CONECTAR.txt")) { throw "Sem COMO_CONECTAR.txt" }
          Get-Content "$env:ProgramData\AdvogaFacil\config\COMO_CONECTAR.txt"
          $eu = [System.Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          foreach ($a in @("CODIGO_DE_INSTALACAO.txt", "COMO_CONECTAR.txt")) {
            $sids = (Get-Acl "$env:ProgramData\AdvogaFacil\config\$a").Access | ForEach-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value }
            if ($sids -notcontains $eu) { throw "Quem instalou não consegue abrir $a pelo atalho" }
          }
          $sidsCfg = (Get-Acl "$env:ProgramData\AdvogaFacil\config\servidor.json").Access | ForEach-Object { $_.IdentityReference.Translate([System.Security.Principal.SecurityIdentifier]).Value }
          if ($sidsCfg -contains $eu) { throw "servidor.json ficou acessível fora dos Administradores" }
          # Recuperação da senha da Master: atalho instalado; sem Master ainda, o comando recusa sem alterar nada
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\Advoga Fácil Servidor\Recuperar a senha da Master.lnk")) { throw "Sem atalho de recuperação da senha da Master" }
          & "${env:ProgramFiles}\AdvogaFacilServidor\servidor\AdvogaFacilServidor.exe" recuperar-senha-master | Out-Host
          if ($LASTEXITCODE -ne 1) { throw "recuperar-senha-master deveria recusar quando ainda não há Master (código $LASTEXITCODE)" }
          # O PostgreSQL só escuta no próprio computador
          $pg = Get-NetTCPConnection -LocalPort 5433 -State Listen
          if ($pg | Where-Object { $_.LocalAddress -ne "127.0.0.1" }) { throw "PostgreSQL exposto fora de 127.0.0.1" }
          Get-NetFirewallRule -DisplayName "Advoga Fácil Servidor*" | Format-Table DisplayName, Profile, Enabled
          $id1 = $s.servidor_id
          # 2) Atualização por cima (mesmo instalador): para os serviços, faz cópia do banco e mantém os dados
          Start-Process $inst.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG=inst2.log" -Wait
          $s = Esperar-Servidor
          if ($s.servidor_id -ne $id1) { throw "A atualização trocou a identidade do servidor" }
          if (-not (Get-ChildItem "$env:ProgramData\AdvogaFacil\atualizacoes\antes-da-atualizacao_*.dump")) { throw "Sem cópia antes da atualização" }
          # 3) Desinstalação: remove serviços e regras, preserva os dados
          & "${env:ProgramFiles}\AdvogaFacilServidor\unins000.exe" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART | Out-Null
          # O desinstalador do Inno se copia para a pasta temporária e continua em segundo plano
          for ($i = 0; $i -lt 40 -and (Test-Path "${env:ProgramFiles}\AdvogaFacilServidor\unins000.exe"); $i++) { Start-Sleep -Seconds 3 }
          if (Get-Service AdvogaFacilServidor -ErrorAction SilentlyContinue) { throw "Serviço não removido" }
          if (Get-Service AdvogaFacilPostgreSQL -ErrorAction SilentlyContinue) { throw "Serviço do banco não removido" }
          for ($i = 0; $i -lt 10 -and (Get-NetFirewallRule -DisplayName "Advoga Fácil Servidor*" -ErrorAction SilentlyContinue); $i++) { Start-Sleep -Seconds 3 }
          if (Get-NetFirewallRule -DisplayName "Advoga Fácil Servidor*" -ErrorAction SilentlyContinue) { Diagnostico; throw "Regra de firewall não removida" }
          if (-not (Test-Path "$env:ProgramData\AdvogaFacil\postgres\data\PG_VERSION")) { throw "Os dados foram apagados" }
          Write-Host "Instalador do servidor: instalação, atualização e desinstalação conferidas."
      - name: Teste real do instalador do aplicativo
        shell: pwsh
        run: |
          $inst = Get-ChildItem dist\instaladores\AdvogaFacil-Instalador-*.exe | Select-Object -First 1
          Start-Process $inst.FullName -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait
          if (-not (Test-Path "${env:ProgramFiles}\Advoga Fácil\AdvogaFacil.exe")) { throw "Aplicativo não instalado" }
          Write-Host "Instalador do aplicativo conferido."
      - name: Reunir registros da instalação
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force logs-instalacao | Out-Null
          Copy-Item inst*.log logs-instalacao -ErrorAction SilentlyContinue
          Copy-Item "$env:ProgramData\AdvogaFacil\logs\*" logs-instalacao -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-instalacao
          path: logs-instalacao
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          path: dist/instaladores/*.exe
